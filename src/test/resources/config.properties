# Test-only configuration. Committed deliberately: MUnit needs these values to
# exist, and src/main/resources/config.properties is gitignored, so without this
# file a fresh clone could not run the suite. Everything here is fake.
#
# Test resources precede main resources on the MUnit classpath, so these values
# win during `mvn test` regardless of what a developer has configured locally.
# That keeps the suite deterministic.

http.port=8081

webhook.secret=test-secret

anypoint.host=anypoint.mulesoft.com
anypoint.client.id=test-client-id
anypoint.client.secret=test-client-secret

scale.up.threshold=80
scale.down.threshold=30
scale.min.replicas=1
scale.max.replicas=5
scale.step=1
scale.cooldown.seconds=600

anypoint.org.id=test-org-id
anypoint.env.id=test-env-id

# Disabled so the scheduler never fires during tests; the decay logic is
# exercised by calling decay-one-deployment directly.
decay.enabled=false
decay.interval.seconds=300
decay.start.delay.seconds=86400
decay.idle.seconds=1800
